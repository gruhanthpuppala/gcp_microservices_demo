name: Install Dependencies

# This workflow is triggered manually
on:
  workflow_dispatch:

jobs:
  install-dependencies:
    runs-on: boutique-runner # Uses your specific self-hosted runner
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          repository: gruhanthpuppala/gcp_microservices_demo # Your GitHub repository
          ref: develop-branch # The branch containing the script

      - name: Install Dependencies
        run: |
          echo "Navigating to the directory containing the script..."
          cd .github/workflows # Navigate to the correct path
          
          echo "Running install-dependencies.sh..."
          chmod +x install-dependencies.sh
          ./install-dependencies.sh

      - name: Create Marker File
        run: |
          touch /tmp/dependencies_installed.marker
          echo "Marker file created to indicate successful installation of dependencies."
